[project]
name = "fish_portal"
version = "0.1.0"
description = "Омниканальная витрина и B2B-портал цеха рыбопереработки"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django~=5.2",
    "gunicorn~=23.0",
    "psycopg[binary]~=3.3",
    "pydantic-settings~=2.16",
    "pyyaml>=6.0.0,<7.0.0",
    "whitenoise~=6.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
