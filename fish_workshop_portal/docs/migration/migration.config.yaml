# =============================================================================
# ПАРАМЕТРЫ ПЕРЕНОСА DJANGO + DOCKER COMPOSE + POSTGRESQL
# =============================================================================
# Размещение: docs/migration/migration.config.yaml
#
# МЕТАДАННЫЕ ДОКУМЕНТА
# project_id: uralsfish       # Строковой идентификатор проекта
# author: Грахов           # Кем заполнено
# date: 12.11.2026            # Дата заполнения (YYYY-MM-DD)
# status: "draft"        # [draft | ready | applied]
#
# НАЗНАЧЕНИЕ И СВЯЗЬ С ПРОЦЕДУРОЙ
# Файл содержит только входные параметры процедуры переноса.
# Заполняется до начала выполнения. Сам по себе ничего не выполняет.
# Журнал выполнения, контрольные суммы и статусы сюда не пишутся.
#
# КАТЕГОРИИ ПАРАМЕТРОВ
#   [MUST]         (Обязательные) — заполняется всегда.
#   [IF <условие>] (Условные)     — заполняется при выполнении условия.
#   [OPT]          (Косвенные)    — допускается null/[], несут информационный 
#                                   характер или используются для будущего развития.
#
# СОГЛАШЕНИЕ О ЗНАЧЕНИЯХ
#   null         — значение не определено либо не требуется при выбранном способе.
#   []           — подтверждённо пустой список.
#   true/false   — логические значения без кавычек.
# Два пробела на уровень отступа, без табуляции.
#
# БЕЗОПАСНОСТЬ
# Секреты (пароли, токены, ключи) не записываются. 
# Указываются только пути или имена переменных окружения.
#
# ПРАВИЛА ИЗМЕНЕНИЙ
# Заполненный YAML не разрешает удаление или перезапись данных (выполняется 
# строго по шагам MIGRATION.md). Не подменяйте неизвестные значения предположениями.
# =============================================================================

schema_version: 1

# =============================================================================
# 1. РЕЖИМ ВЫПОЛНЕНИЯ
# =============================================================================
migration:
  # [MUST] Определяет ветки процедуры.
  #   update  — целевой сервер развёрнут, продуктивные данные сохраняются;
  #             создаются точка отката (3.0–3.3) и откат (8.2–8.4).
  #   initial — первичное развёртывание; 3.0–3.3 пропускаются,
  #             8.1 использует ветку раннего отката.
  # Влияет на обязательность:
  #   update  → journal.rollback_dir [MUST], database.mode ∈ {keep, restore};
  #             storage.items[*].transfer = false для продуктивных
  #             хранилищ, которые не требуется переносить.
  #   initial → database.mode ∈ {fresh, restore}.
  mode: initial

# =============================================================================
# 2. ЖУРНАЛ
# =============================================================================
journal:
  # [MUST] Абсолютный путь к журналу выполнения на целевом сервере.
  # Не должен находиться внутри target.project_dir (иначе rsync --delete
  # уничтожит журнал при откате 8.2).
  # Каталог создаётся, файл дополняется строками "<шаг>\t<ts>\t<статус>\t...".
  path: null

  # [IF migration.mode = update] Абсолютный каталог артефактов отката:
  # files_backup_*, db_rollback_*.dump, images_rollback.tar,
  # rollback_point.env, latest_db_dump.name.
  # Не должен находиться внутри target.project_dir.
  # [IF migration.mode = initial] допускается null (3.1 и 3.2.2 не выполняются).
  # В обоих режимах должен находиться на отдельной ФС от target.project_dir
  # либо иметь суммарный запас 2× размера проекта (3.1) и 3× размера БД
  # (3.2.3) — проверяется на шагах 2.12 и 3.1.
  rollback_dir: null

# =============================================================================
# 3. СЕРВЕРЫ
# =============================================================================
source:
  ssh:
    # [MUST] IP-адрес или DNS-имя. Без схемы, пользователя и порта.
    host: null
    # [MUST] SSH-порт, целое число.
    port: 22
    # [MUST] Учётная запись SSH на исходном сервере.
    user: null

  # [MUST] Абсолютный путь к существующему каталогу проекта на исходном
  # сервере. От него отсчитываются storage.items[*].source_relative_path
  # и secrets.source_path (если задан абсолютным путём).
  project_dir: null

target:
  ssh:
    # [MUST] Адрес production-сервера для SSH.
    host: null
    # [MUST] SSH-порт, целое число.
    port: 22
    # [MUST] Учётная запись SSH на целевом сервере.
    user: null

  # [MUST] Абсолютный путь каталога проекта на целевом сервере.
  # Создаётся при развёртывании, если отсутствует.
  # От него отсчитываются secrets.target_relative_path и
  # storage.items[*].target_relative_path.
  project_dir: null

# =============================================================================
# 4. ФАЙЛ СЕКРЕТОВ
# =============================================================================
secrets:
  # [MUST] Абсолютный путь к заранее подготовленному production-файлу
  # с переменными окружения на исходном сервере.
  # Содержимое не выводится в команды и журнал.
  source_path: null

  # [MUST] Путь относительно target.project_dir, по которому файл
  # будет размещён. Относительный, без ведущего "/" и без "..".
  # Пример: ".env".
  # Согласование: это же значение обязано присутствовать в
  # code_delivery.exclude_paths (при любом method), иначе
  # git clean -fd / rsync --delete удалит файл при доставке кода.
  target_relative_path: null

# =============================================================================
# 5. ДОСТАВКА КОДА
# =============================================================================
code_delivery:
  # [MUST] Способ доставки кода:
  #   remote_git — git fetch из удалённого репозитория на целевом сервере;
  #   local_git  — git bundle с исходного сервера по SSH;
  #   no_git     — rsync каталога проекта с исходного сервера.
  # Влияет: заполняется ровно один из подразделов remote_git/local_git;
  # при method=no_git ни один подраздел не заполняется.
  method: null

  # [IF code_delivery.method = remote_git]
  remote_git:
    # [MUST] URL без пароля и токена.
    url: null
    # [MUST] Ветка, тег или полный SHA коммита.
    ref: null

  # [IF code_delivery.method = local_git]
  local_git:
    # [MUST] Полный SHA коммита, переносимого через bundle.
    ref: null

  # [MUST] Исключения из поставки кода и из очистки рабочего дерева:
  # пути относительно корня проекта, без "./" и ведущего "/".
  # Используются как шаблоны git clean -e и rsync --exclude.
  # Согласование: пути secrets.target_relative_path и
  # storage.items[*].target_relative_path обязаны присутствовать здесь
  # при method=no_git (иначе --delete удалит продуктивные данные).
  # При method ∈ {remote_git, local_git} дублирование не требуется,
  # если путь уже в .gitignore.
  # [] — исключений нет.
  exclude_paths: []

# =============================================================================
# 6. POSTGRESQL
# =============================================================================
database:
  # [MUST] Режим работы с БД целевого сервера:
  #   restore — перенос логического дампа с исходного сервера;
  #   fresh   — пустая БД, схема накатывается миграциями;
  #   keep    — продуктивная БД целевого сервера сохраняется,
  #             обновляется только миграциями.
  # Согласование с migration.mode:
  #   mode=update  → допустимо {keep, restore};
  #   mode=initial → допустимо {fresh, restore}.
  # Влияет на выполнение шагов: 5.2 и 5.3.1 выполняются только
  # при database.mode=restore; 6.2 использует ветку по значению.
  mode: null

  # [MUST] Имя сервиса СУБД в docker-compose.yml.
  # Используется во всех psql/pg_dump/pg_restore/pg_isready/pg_terminate_backend.
  service: null

  # [MUST] Имена переменных окружения контейнера СУБД (не значения).
  # Применяются в psql/pg_dump/pg_restore/pg_isready как $-DB_USER, $-DB_NAME.
  environment_keys:
    name: null
    user: null

# =============================================================================
# 7. ФАЙЛОВЫЕ ХРАНИЛИЩА
# =============================================================================
# Для каждого элемента списка storage.items используются ровно четыре поля:
#
#   id                     — стабильный идентификатор для ссылок
#                            вида storage.items[id=<id>];
#   transfer               — true: содержимое переносится с исходного
#                            сервера; false: перенос не выполняется,
#                            целевые данные сохраняются;
#   source_relative_path   — путь относительно source.project_dir;
#   target_relative_path   — путь относительно target.project_dir.
#
# Согласование:
#   - при migration.mode=update продуктивные хранилища, которые НЕ должны
#     перезаписываться, обязаны иметь transfer: false;
#   - при наличии хотя бы одного transfer: true требуется рабочий
#     доступ с целевого сервера на исходный по SSH (шаг 2.10.1);
#   - при code_delivery.method=no_git каждое значение
#     storage.items[*].target_relative_path обязано присутствовать
#     в code_delivery.exclude_paths;
#   - все target_relative_path обязаны находиться внутри
#     target.project_dir (внешние docker-тома этой процедурой не
#     покрываются).
#
# Пример заполнения (удалить комментарий и заменить значения):
#
#   items:
#     - id: "application_cache"
#       transfer: true
#       source_relative_path: "storage/cache"
#       target_relative_path: "storage/cache"
#     - id: "exchange_storage"
#       transfer: false
#       source_relative_path: "storage/exchange"
#       target_relative_path: "storage/exchange"
#
# [] — хранилищ, подлежащих переносу, нет (например, migration.mode=initial).
storage:
  items: []

# =============================================================================
# 8. ПРИЛОЖЕНИЕ
# =============================================================================
application:
  # [MUST] Имя сервиса приложения в docker-compose.yml.
  service: null

  # [MUST] Production-домен из ALLOWED_HOSTS, без схемы и порта.
  # Передаётся в заголовке Host при проверке 7.2.
  host: null

  # [MUST] Определяет ветку шага 6.3:
  #   true  — миграции выполняются при старте контейнера
  #           (docker compose up -d);
  #   false — миграции применяются вручную до запуска пула
  #           (docker compose run --rm <service> python manage.py migrate).
  migrations_on_web_start: null

  healthcheck:
    # [MUST] Способ проверки готовности в шаге 7.2:
    #   host      — HTTP-порт приложения опубликован на 127.0.0.1 хоста
    #               через ports:; проверка выполняется с хоста;
    #   container — проверка выполняется внутри контейнера приложения
    #               на 127.0.0.1:<container_port>; ports:/expose: не нужны.
    mode: null

    # [IF application.healthcheck.mode = host]
    # [MUST при mode=host] Порт хоста, доступный на 127.0.0.1.
    # Пример: при ports: ["8080:8000"] указывается 8080.
    # [IF mode = container] null.
    published_port: null

    # [IF application.healthcheck.mode = container]
    # [MUST при mode=container] Внутренний HTTP-порт приложения.
    # Пример: при ports: ["8080:8000"] указывается 8000.
    # [IF mode = host] null.
    container_port: null

    # [MUST] Endpoint готовности, начинается с "/", возвращает 200
    # только при готовности приложения. Пример: "/health/".
    path: null

# =============================================================================
# 9. СОГЛАСОВАННОСТЬ ДАННЫХ
# =============================================================================
consistency:
  # [MUST] Способ фиксации writers исходного сервера перед снятием дампа
  # (шаг 5.1):
  #   stop_writers — docker compose stop приложения, остановка хостовых
  #                  планировщиков (cron/systemd) и терминация соединений;
  #   coordinated  — включение режима обслуживания management-командой
  #                  set_maintenance_mode (требует её реализации в коде;
  #                  при отсутствии команды шаг 5.1 падает и требует
  #                  переключения на stop_writers);
  #   not_needed   — блокировка не требуется.
  # Влияет на ветку 5.1, а также на состав 8.4 (Место 2) — какие
  # сервисы источника возвращать в работу.
  capture_method: null