# =============================================================================
# ПАРАМЕТРЫ ПЕРЕНОСА DJANGO + DOCKER COMPOSE + POSTGRESQL
# =============================================================================
#
# НАЗНАЧЕНИЕ
# Этот файл описывает один конкретный перенос: откуда и куда переносится
# приложение, как доставляется код, какие данные сохраняются.
#
# Размещение: docs/migration/migration.config.yaml.
# Связанная инструкция: MIGRATION.md в этой же директории.
# YAML содержит параметры и принятые решения.
# MIGRATION.md содержит порядок действий, команды и проверки результата.
# Сам по себе этот файл ничего не выполняет.
#
# КАК ЗАПОЛНЯТЬ
# Двигайтесь сверху вниз. Перед каждым разделом указаны его назначение
# и порядок заполнения. Сначала выберите способ действий, затем заполните
# только относящиеся к нему настройки по комментариям рядом с ними.
#
# КАТЕГОРИИ ПАРАМЕТРОВ
# ОБЯЗАТЕЛЬНЫЕ — используются для подключения и определения путей.
# ВЛИЯЮЩИЕ НА ПРОЦЕДУРУ — определяют выбор действий; влияние описано рядом.
# ИНФОРМАЦИОННЫЕ — описывают проект и окружение, не меняют действия.
#
# ЗНАЧЕНИЯ И ПРИМЕРЫ
# Значения из проекта-примера требуют проверки перед использованием.
# Примеры неизвестных значений приводятся только в комментариях.
# Не переносите пример в поле без проверки его применимости.
# null — значение не определено либо не требуется при выбранном способе;
#        различие объясняется в комментарии к полю.
# [] — подтверждённо пустой список, а не отсутствие сведений.
# true — да; false — нет. Логические значения пишутся без кавычек.
# Используйте два пробела на уровень отступа, без табуляции.
# Не повторяйте ключи с одинаковым именем внутри одного раздела.
#
# ССЫЛКИ ИЗ ИНСТРУКЦИИ
# migration.config.yaml: source.ssh.host
#   означает ключ host внутри source → ssh.
# migration.config.yaml: storage.items[id=application_cache]
#   означает элемент списка storage.items с указанным id.
# Это обозначения расположения данных, а не команды.
#
# БЕЗОПАСНОСТЬ
# Не записывайте пароли, токены, закрытые ключи и содержимое файлов секретов.
# Указывайте только имена переменных или пути к файлам, содержащим секреты.
#
# ДЛЯ ЧЕЛОВЕКА И ИИ-ИСПОЛНИТЕЛЯ
# Не подменяйте неизвестные значения предположениями.
# При отсутствии необходимых сведений запросите их, указав точный ключ.
# Заполненный YAML не разрешает удаление или перезапись данных.
# Изменения выполняются по согласованной процедуре из MIGRATION.md.
#
# СОСТОЯНИЕ ДОКУМЕНТА
# Шапка и раздел 1 приведены к обсуждаемому формату.
# Разделы 2–7 сохранены из предыдущей редакции для дальнейшего обсуждения.
# Документ пока не описывает полную процедуру миграции.

# Версия структуры файла. Не меняйте при заполнении параметров проекта.
schema_version: 1

# =============================================================================
# 1. ПРОЕКТ И СЕРВЕРЫ
# =============================================================================
# Укажите серверы и каталоги, между которыми переносится приложение.
#
# ПОРЯДОК ЗАПОЛНЕНИЯ
# 1. Заполните source.ssh и target.ssh реквизитами действующего SSH-доступа.
# 2. Укажите существующий source.project_dir и целевой target.project_dir.
# 3. Сведения об ОС получите на каждом сервере: cat /etc/os-release.
#    distribution — поле ID, version — поле VERSION_ID.

# --- ИНФОРМАЦИОННЫЕ: название проекта ---
project:
  # Короткое название проекта для обозначения переноса.
  # Не используется как имя Compose-проекта, каталога или сервиса.
  # Формат: строчные латинские буквы, цифры и дефисы; начало — буква.
  # Пример для рассматриваемого приложения:
  id: "fish-workshop"

source:
  # --- ОБЯЗАТЕЛЬНЫЕ: подключение к исходному серверу ---
  ssh:
    # IP-адрес или DNS-имя исходного сервера.
    # Примеры: "192.0.2.10", "source.example.com".
    # Без "ssh://", имени пользователя и порта.
    host: null
    # SSH-порт. Оставьте 22 для стандартного порта.
    # При другом порте укажите его число, например 2222.
    port: 22
    # Пользователь, под которым подключаетесь к исходному серверу.
    # Пример: "developer".
    user: null

  # --- ОБЯЗАТЕЛЬНЫЕ: расположение исходного проекта ---
  # Полный путь к существующему каталогу проекта на исходном сервере.
  # Пример: "/home/developer/fish-workshop".
  # Укажите путь на сервере, не внутри контейнера; не используйте "~".
  # От этого каталога отсчитываются compose.files и
  # storage.items[*].source_relative_path.
  project_dir: null

  # --- ИНФОРМАЦИОННЫЕ: ОС исходного сервера ---
  # Описывает источник; не выбирает команды подготовки production-сервера.
  os:
    # Поле ID из /etc/os-release. Для текущего примера — "kali".
    distribution: "kali"
    # Поле VERSION_ID в кавычках. Если поля нет, оставьте null.
    version: null

target:
  # --- ОБЯЗАТЕЛЬНЫЕ: подключение к production-серверу ---
  ssh:
    # Адрес сервера для SSH, а не будущий домен сайта.
    # Примеры: "192.0.2.20", "production.example.com".
    host: null
    # Порт, через который подключаетесь сейчас.
    # Оставьте 22 для стандартного порта; иначе укажите свой.
    port: 22
    # Пользователь, под которым уже можете подключиться.
    # Примеры: "ubuntu", "deploy". Если deploy ещё не создан,
    # укажите текущую учётную запись.
    user: null

  # --- ОБЯЗАТЕЛЬНЫЕ: расположение production-проекта ---
  # Полный путь размещения проекта. Пример: "/opt/fish-workshop".
  # Для нового развёртывания укажите отдельный каталог приложения.
  # Если его нет, он создаётся при развёртывании.
  # От этого каталога отсчитываются compose.files и
  # storage.items[*].target_relative_path.
  project_dir: null

  # --- ВЛИЯЮЩИЕ НА ПРОЦЕДУРУ: ОС production-сервера ---
  # Определяет команды установки системных пакетов и Docker.
  # Для примера используется Ubuntu 24.04. Если фактическая ОС другая,
  # запишите её значения и адаптируйте подготовку сервера до выполнения команд.
  os:
    # Поле ID из /etc/os-release.
    distribution: "ubuntu"
    # Поле VERSION_ID из /etc/os-release, в кавычках.
    version: "24.04"

# =============================================================================
# 2. ФАКТИЧЕСКОЕ РАЗВЁРТЫВАНИЕ — ДЛЯ ДАЛЬНЕЙШЕГО ОБСУЖДЕНИЯ
# =============================================================================
compose:
  # Действующее имя Compose-проекта на источнике.
  # Проверить: запуск мог использовать -p или COMPOSE_PROJECT_NAME.
  source_project_name: null
  # Имя Compose-проекта на назначении.
  target_project_name: null
  # Пути относительно project_dir: основной файл, затем override-файлы.
  files:
    - "docker-compose.yml"

application:
  service: "web"
  dockerfile: "Dockerfile"
  build_context: "."
  # Значения из предоставленной конфигурации примера.
  python_image: "python:3.12-slim-bookworm"
  dependency_manager: "uv"
  dependency_manifest: "pyproject.toml"
  dependency_lock: "uv.lock"
  wsgi_application: "config.wsgi:application"
  # Порт внутри контейнера.
  container_port: 8000
  # Исходная публикация, не рекомендация для production.
  current_published_ports:
    - "8000:8000"
  # Пути относительно корня проекта; содержимое секретов сюда не копировать.
  runtime_env_files:
    - ".env"
  # Текущее поведение: migrate запускается перед Gunicorn.
  migrations_on_web_start: true

# =============================================================================
# 3. ДОСТАВКА КОДА — ДЛЯ ДАЛЬНЕЙШЕГО ОБСУЖДЕНИЯ
# =============================================================================
code_delivery:
  # Выберите remote_git, local_git или no_git.
  # Затем заполните одноимённый подраздел; остальные оставьте без изменений.
  method: null
  # Только при method: remote_git.
  remote_git:
    # URL без пароля и токена. Пример: git@example.com:owner/project.git.
    url: null
    # Ветка, тег или коммит.
    ref: null
    # Полный идентификатор выбранного коммита; определяется исполнителем.
    resolved_commit: null
  # Только при method: local_git.
  local_git:
    # bundle — передача истории; archive — файлы выбранного коммита.
    export: null
    # Полный идентификатор переносимого коммита.
    commit: null
  # Только при method: no_git.
  no_git:
    # rsync или archive.
    transport: null
    # Идентификатор поставки. Пример: release-2026-11-01-01.
    snapshot_id: null
  # Для Git: require_clean, exclude или separate. Для no_git — null.
  # require_clean — требовать чистое рабочее дерево;
  # exclude — подтверждённо исключить локальные изменения;
  # separate — оформить их отдельным проверяемым артефактом.
  uncommitted_changes_policy: null
  # Дополнительные файлы кода вне Git-экспорта, без секретов и хранилищ.
  # Пути от source.project_dir; [] — файлов нет, null — ещё не проверено.
  additional_files: null
  # Исключения из поставки кода: пути относительно корня проекта.
  # Для Git-экспорта также проверить состав коммита.
  exclude_paths:
    - ".git"
    - ".venv"
    - "__pycache__"
    - ".pytest_cache"
    - ".env"
    - ".env.development"
    - ".env.local"
    - ".env.production"
    - "storage/cache"
    - "storage/exchange"

# =============================================================================
# 4. POSTGRESQL — ДЛЯ ДАЛЬНЕЙШЕГО ОБСУЖДЕНИЯ
# =============================================================================
database:
  # fresh — новая БД; restore — логический dump/restore всей БД приложения.
  mode: null
  service: "db"
  image: "postgres:17-alpine"
  # Имена переменных конфигурации; не значения паролей.
  environment_keys:
    name: "DB_NAME"
    user: "DB_USER"
    password: "DB_PASSWORD"
  volume:
    # Логический ключ Compose, не обязательно реальное имя Docker-тома.
    compose_key: "pgdata"
    # Фактическое имя тома на источнике, включая префикс при его наличии.
    source_actual_name: null
    container_path: "/var/lib/postgresql/data"
  # Имя или относительный путь дампа; при mode: fresh оставить null.
  dump_artifact: null

# =============================================================================
# 5. ФАЙЛОВЫЕ ХРАНИЛИЩА — ДЛЯ ДАЛЬНЕЙШЕГО ОБСУЖДЕНИЯ
# =============================================================================
# PostgreSQL описан в database.volume и не повторяется здесь.
# Для каждого элемента выберите action:
# copy_all — всё содержимое, кроме exclude;
# copy_selected — только include, кроме exclude;
# recreate — восстановить содержимое по отдельной процедуре;
# skip — содержимое не переносить.
# recreate и skip не означают удаление существующих файлов назначения.
# include/exclude: точные относительные пути внутри хранилища, без масок.
# Каталог означает его поддерево; абсолютные пути и выход через '..' запрещены.
# При copy_selected include обязателен и не может быть пустым.
# При остальных action include оставляется null.
# Для копирования verification: checksums означает проверку SHA-256
# и совпадения набора путей в переносимой части хранилища.
# При recreate заполните recreate_procedure ссылкой на процедуру.
storage:
  items:
    - id: "application_cache"
      purpose: "Хранилище приложения; проверить наличие необходимого XLSX-прайса"
      type: "bind_mount"
      # Пути на хостах относительно соответствующего project_dir.
      source_relative_path: "storage/cache"
      target_relative_path: "storage/cache"
      container_path: "/app/cache"
      action: null
      include: null
      exclude: []
      verification: null
      recreate_procedure: null
    - id: "exchange_storage"
      purpose: "Каталог обмена; проверить фактическое использование на этапе 1"
      type: "bind_mount"
      source_relative_path: "storage/exchange"
      target_relative_path: "storage/exchange"
      container_path: "/exchange"
      action: null
      include: null
      exclude: []
      verification: null
      recreate_procedure: null

# =============================================================================
# 6. СОГЛАСОВАННОСТЬ ДАННЫХ — ДЛЯ ДАЛЬНЕЙШЕГО ОБСУЖДЕНИЯ
# =============================================================================
consistency:
  # При переносе БД или файлов указать, связаны ли записи БД с файлами.
  # true — требуется согласованная точка; false — зависимости нет.
  database_and_files_linked: null
  # stop_writers — остановить запись на время финальной фиксации;
  # coordinated — использовать отдельную согласованную процедуру;
  # not_needed — подтверждено отсутствие изменений в переносимых данных.
  capture_method: null
  # При coordinated: ссылка на процедуру, не исполняемая команда.
  coordinated_procedure: null
  # При stop_writers: все источники записи — сервисы, cron, интеграции,
  # ручное обновление файлов. [] — источников нет; null — не исследованы.
  writers: null

# =============================================================================
# 7. ПРОВЕРКА ИНВЕНТАРИЗАЦИИ — ДЛЯ ДАЛЬНЕЙШЕГО ОБСУЖДЕНИЯ
# =============================================================================
review:
  # Подтверждение инвентаризации, не разрешение выполнять миграцию.
  inventory_approved: false
  # Сверить эти сведения с действующим окружением;
  # после проверки удалить соответствующий путь из списка.
  verify_fields:
    - "source.os"
    - "target.os"
    - "compose.files"
    - "application"
    - "database"
    - "storage.items"

# Сеть, права, резервирование, развёртывание, проверки, переключение и откат
# добавляются по мере согласования. До этого полную миграцию не выполнять.
