# Конфигурация Nginx: единственная публичная точка входа (порты 80/443), терминация TLS, редирект 80 -> 443, прямая отдача /static/ из read-only тома static_volume, проброс заголовков Host/X-Forwarded-For/X-Forwarded-Proto, защита /admin/ вторым независимым рубежом (HTTP Basic Auth и/или IP Allowlist), запрет HTTP-доступа к /exchange/.
#
# Динамический ре-резолвинг реплик web — на уровне upstream-группы:
#   upstream web_upstream {
#       zone web_upstream 64k;              # resolve требует shared memory
#       server web:8000 resolve;            # фоновый ре-резолв по TTL
#       resolver 127.0.0.11 valid=10s ipv6=off;
#       resolver_timeout 5s;
#       keepalive 32;
#   }
#   ...
#   proxy_pass http://web_upstream;
#
# Платформенное требование: OSS nginx >= 1.27.3. Параметр resolve у server в upstream и директива resolver в контексте upstream появились в 1.27.3 (до этого — только nginx Plus); на <= 1.27.2 конфиг падает с "resolver directive is not allowed here". Тег образа в docker-compose.yml пиннится явно; плавающий тег недопустим.
#
# resolver объявляется в контексте upstream (или http), но НЕ в server: директива из server-блока не покрывает upstream-группу.
#
# keepalive-пул требует согласования с бэкендом: gunicorn --keepalive должен быть больше keepalive_timeout nginx (практически --keepalive 75), иначе пул отдаёт уже закрытые соединения (upstream prematurely closed connection).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;
    
    # Cloudflare Real-IP — доверенные префиксы edge. Файл генерируется
    # scripts/update_cf_ips.sh (источник: cloudflare.com/ips), в git — seed.
    # IPv6-записи инертны до включения v6 end-to-end — см. ADR-010.
    include /etc/nginx/dynamic/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # web upstream: keepalive-пул соединений + рантайм DNS-резолвинг реплик web (ADR-009 start-first).
    # 'resolve' в upstream доступен в OSS nginx >= 1.27.3 (до 1.27.3 — только nginx Plus).
    upstream web_upstream {
        # требование 'resolve' по документации: группа в shared memory
        zone web_upstream 64k;
        # рантайм-ре-резолвинг через Docker DNS: видит --scale web=N и start-first без reload
        server web:8000 resolve;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
         server_name _;
        location = /nginx-health { 
            access_log off; 
            default_type text/plain;
            return 200 "ok\n"; }
        location ^~ /.well-known/acme-challenge/ { 
            root /var/www/certbot; }
        location / { return 444; }
     }
 
    server {
        listen 80;
        server_name uralsfish.ru;
        location = /nginx-health { 
            access_log off; 
            default_type text/plain;
            return 200 "ok\n"; }
        location ^~ /.well-known/acme-challenge/ { 
            root /var/www/certbot; }
        location / { 
            return 301 https://uralsfish.ru$request_uri; }
    }

    # www → apex, без $host/$map: target фиксирован, спуфинг Host не влияет.
    server {
        listen 80;
        server_name www.uralsfish.ru;
        return 301 https://uralsfish.ru$request_uri;
    }

    # ============================================================================
# :443 — основные server-блоки (Model A: fail-closed по SNI)
# Порядок: canonical → www-redirect → catch-all default_server.
# default_server выставлен явно: порядок объявления на поведение не влияет.
# ============================================================================

# ---------------------------------------------------------------------------
# 1. Canonical host: uralsfish.ru
# ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name uralsfish.ru;

        # stub: mount real Let's Encrypt or self-signed certs to /etc/nginx/ssl/ in prod
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # --- Security headers ---
        # Заголовки, которые умеет Django (X-Content-Type-Options, Referrer-Policy, HSTS,
        # X-Frame-Options), отдаёт только Django. Здесь — то, чего Django не умеет.
        # SECURE_HSTS_SECONDS в Django держать = 0, иначе дубль.
        # max-age=300 на первом деплое; после 2-3 недель на валидном LE → 31536000; includeSubDomains.
        add_header Strict-Transport-Security "max-age=300" always;

        # Встраивание (Релиз 1.2, MAX Mini App): только CSP frame-ancestors.
        # XFrameOptionsMiddleware отключён в Django (X_FRAME_OPTIONS="" отдавал бы пустой заголовок).
        add_header Content-Security-Policy
            "frame-ancestors 'self' https://max.ru https://web.max.ru" always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=(), payment=()" always;

        # add_header НЕ наследуется в location, у которого есть свой add_header.
        # /static/ и /admin/ дублируют нужное вручную; /exchange/, /healthz/, /
        # наследуют server-блок целиком.

        # --- Locations ---

        # /static без слэша не должен уходить в Django.
        location = /static {
            default_type text/plain;
            return 404 "Not Found\n";
        }

        location /static/ {
            alias /app/staticfiles/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=300" always;
            add_header Cache-Control "public, max-age=2592000, immutable";
            gzip_static on;
            access_log off;
        }

        # Внутренний файловый шлюз: снаружи не существует. 404, не 403 — не подтверждаем путь.
        # access_log включён намеренно: сканирование должно быть видно в логах.
        location = /exchange {
            default_type text/plain;
            return 404 "Not Found\n";
        }

        location ^~ /exchange/ {
            default_type text/plain;
            return 404 "Not Found\n";
        }

        # /healthz/ — внутренний эндпоинт web, снаружи не существует.
        location ~ ^/healthz/?$ {
            return 404;
        }

        # ^~ /admin без trailing slash: матчит /admin и /admin/..., fail-closed по префиксу.
        # satisfy all не нужен, пока allow/deny закомментированы; при включении allowlist — добавить.
        location ^~ /admin {
            # allow 203.0.113.10;   # jump host / VPN egress
            # allow 198.51.100.7;   # IP оператора
            # deny all;

            auth_basic "Restricted Admin Area";
            auth_basic_user_file /etc/nginx/dynamic/.htpasswd;

            add_header Strict-Transport-Security "max-age=300" always;
            add_header Permissions-Policy
                "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
  }


    # ---------------------------------------------------------------------------
    # 2. www → apex (нужен SAN с www в сертификате).
    # Target зашит литералом — манипуляция Host на редирект не влияет.
    # Без этого блока www.uralsfish.ru уйдёт в default_server → TLS alert.
    # Если www в DNS отсутствует — блок удалить целиком.
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name www.uralsfish.ru;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # HSTS и на редиректе: будущие запросы к www сразу upgrade'ятся на https,
        # без открытого окна. CSP/Permissions-Policy на 301 не нужны — это не документ.
        add_header Strict-Transport-Security "max-age=300" always;

        return 301 https://uralsfish.ru$request_uri;
    }


    # ---------------------------------------------------------------------------
    # 3. Catch-all: любой SNI, не совпавший с server_name выше, рвётся до сертификата.
    # ssl_reject_handshake (nginx >= 1.19.4): TLS alert на ClientHello, без отдачи
    # сертификата и без фингерпринта canonical-хоста. ssl_certificate здесь не нужен.
    # Должен быть ровно один default_server на listen 443 (с учётом IPv6, если появится).
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_reject_handshake on;
    }
}