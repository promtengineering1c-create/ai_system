# Certbot global config — read by every invocation of the certbot image
# (renew, certonly, run) via the default search path /etc/letsencrypt/cli.ini.
#
# deploy-hook is REQUIRED: certbot writes certs to /etc/letsencrypt/live/<lineage>/
# (bind ./data/letsencrypt), but nginx reads from /ssl-out (bind ./data/ssl).
# Without it, nginx keeps serving the cert-init placeholder (30 days) after renew.
#
# The hook only writes files. nginx reload is the caller's job (host cron) —
# the certbot container has no docker socket and no path to the nginx process.
#
# `sh <path>` (not a bare path): certbot runs hooks via shell, so the exec bit
# on the host file is NOT required — survives git checkouts that lose x.
#
# deploy hooks do NOT run on `renew --dry-run` (certbot >= 1.16): a dry run
# cannot publish staging certs into the production /ssl-out.
deploy-hook = sh /hooks/deploy.sh